<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>We Were Here</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
<h1>We Were Here</h1>
<h2>Your thoughts, your art.</h2>
<a href="leave.html" class="button">Leave your trace</a>

<input type="text" id="searchInput" placeholder="Search by name or keyword..." />

<div id="messagesContainer"></div>

<footer>
<p class="terms">Terms and Conditions</p>
<p>All rights reserved</p>
</footer>
</div>

<script>
async function loadMessages(filter="") {
const res = await fetch("/api/messages");
let messages = await res.json();
if(filter) {
filter = filter.toLowerCase();
messages = messages.filter(m => m.name.toLowerCase().includes(filter) || m.text.toLowerCase().includes(filter));
}
const container = document.getElementById("messagesContainer");
container.innerHTML = "";
messages.forEach(msg => {
const div = document.createElement("div");
div.className = "message";
div.innerHTML = `<strong>${msg.name}:</strong> ${msg.text}` + (msg.image ? `<br><img src="${msg.image}" class="msg-image">` : "");
container.appendChild(div);
});
}

document.addEventListener("DOMContentLoaded", () => {
loadMessages();
const search = document.getElementById("searchInput");
search.addEventListener("input", () => loadMessages(search.value));
});
</script>
</body>
</html>
